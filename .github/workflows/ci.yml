name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # The default Linux torch wheel bundles ~2.5 GB of CUDA libraries; the CPU build is enough here.
      - name: Install CPU torch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python run.py test

      - name: Smoke test (TF-IDF baseline)
        run: python run.py smoke --backend baseline

      - name: Cache fine-tuned model
        uses: actions/cache@v4
        with:
          path: models/risk_engine
          key: risk-engine-${{ hashFiles('config/engine.yaml') }}

      # Anonymous download is what reviewers use; while the repo is private it needs the token.
      - name: Download fine-tuned model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python run.py fetch-model || {
            echo "Anonymous download failed; retrying with gh release download"
            gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" -p 'risk_engine-*.zip' -D dist --clobber
            python run.py fetch-model --url dist/risk_engine-v1.0.0.zip
          }

      # GitHub's virtualised macOS runners expose MPS but return different scores from CPU (an
      # Apple-silicon laptop's MPS matches CPU). CPU matches Streamlit Cloud and the other runners.
      - name: Smoke test (fine-tuned transformer)
        env:
          RISK_ENGINE_DEVICE: cpu
        run: python run.py smoke --backend transformer

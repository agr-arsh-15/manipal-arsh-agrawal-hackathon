engine:
  name: "AI/NLP Financial Risk Engine"
  version: "v1.0.0"
  device: "auto" # options: auto, mps, cuda, cpu
  random_seed: 42

paths:
  data_dir: "data"
  samples_dir: "data/samples"
  prices_dir: "data/prices"
  models_dir: "models"
  reports_dir: "reports"
  signals_file: "data/samples/signals.jsonl"

model:
  encoder: "distilroberta-base"
  max_length: 64
  batch_size: 32
  epochs: 4
  learning_rate: 3.0e-5
  checkpoint_dir: "models/risk_engine"

# Chronological split for dated sources (Benzinga, Stock Tweets). Undated PhraseBank rows
# are assigned by a deterministic hash of doc_id using the same 70/15/15 proportions.
splits:
  train_end: "2019-07-01"
  val_end: "2019-11-01"

dataset:
  benzinga_feeds:
    - path: "data/raw/benzinga/raw_analyst_ratings.csv"
      max_rows: 9000
    - path: "data/raw/benzinga/raw_partner_headlines.csv"
      max_rows: 4000
  tweets_path: "data/raw/stock_tweets/reduced_dataset-release.csv"
  tweets_max_rows: 4000
  start_date: "2018-04-01"
  # Benzinga headlines tagged to index / credit / commodity ETFs describe market-wide news.
  # They are labelled with the SPY move (market scope) rather than an abnormal return.
  market_proxies: ["SPY", "QQQ", "DIA", "IWM", "XLF", "HYG", "LQD", "TLT", "EEM", "GLD", "USO", "VXX"]

impact:
  event_window_days: [0, 1]
  benchmark_ticker: "SPY"
  volatility_lookback_days: 60
  macro_volatility_ticker: "^VIX"
  bin_count: 10
